services:
  postgres:
    image: postgres:16
    container_name: churnwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-churnwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churnwatch}
      POSTGRES_DB: ${POSTGRES_DB:-churnwatch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-churnwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
